<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL-RIOT // Secure Console</title><script src="https://cdn.tailwindcss.com"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020207;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 15%,#22d3ee18,transparent 32%),radial-gradient(circle at 15% 85%,#a855f720,transparent 28%),linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px}.glow{box-shadow:0 0 0 1px #22d3ee22,0 0 60px #22d3ee12,0 30px 100px #000}.card{background:linear-gradient(145deg,#0b0d14f5,#05060bf2);border:1px solid #ffffff12;backdrop-filter:blur(28px)}.pin{letter-spacing:.55em;text-align:center;font-size:2rem;font-weight:900}.pin:focus{box-shadow:0 0 0 2px #22d3ee55,0 0 35px #22d3ee18}.btn{transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.shake{animation:shake .28s}.hidden{display:none!important}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}</style></head><body class="grid place-items-center p-5"><div class="w-full max-w-md relative"><div class="text-center mb-7"><div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-300/20 bg-cyan-300/5 text-cyan-300 text-xs font-black tracking-[.25em]">PIXEL-RIOT // SECURE</div><h1 class="text-5xl font-black tracking-tight mt-5">ADMIN<span class="text-cyan-300">.</span></h1><p class="text-white/45 mt-2">Private control console</p></div><section id="gate" class="card glow rounded-[32px] p-7 sm:p-9"><div class="w-16 h-16 rounded-2xl mx-auto grid place-items-center bg-cyan-300/10 border border-cyan-300/20 text-cyan-300 text-2xl">⌁</div><h2 class="text-center text-xl font-black mt-5">Enter admin PIN</h2><p class="text-center text-sm text-white/40 mt-2">Use the PIN assigned to your admin account.</p><form id="pin-form" class="mt-7"><input id="pin" class="pin w-full bg-white/[.03] border border-white/10 rounded-2xl py-4 px-4 outline-none" inputmode="numeric" autocomplete="one-time-code" maxlength="12" pattern="[0-9]{6,12}" placeholder="••••••" aria-label="Admin PIN" required><button class="btn w-full mt-4 rounded-2xl py-3.5 bg-cyan-300 text-black font-black" type="submit">Unlock console</button></form><p id="msg" class="min-h-5 text-center text-sm mt-4 text-white/45"></p><button id="change-open" class="btn w-full mt-2 py-3 rounded-2xl border border-white/10 text-white/60 font-bold text-sm">Change my PIN</button></section><section id="change" class="card glow rounded-[32px] p-7 sm:p-9 hidden"><h2 class="text-xl font-black">Change PIN</h2><p class="text-sm text-white/40 mt-2">Your current PIN is required. New PINs must be 6–12 digits.</p><form id="change-form" class="mt-6 space-y-3"><input id="old" class="w-full bg-white/[.03] border border-white/10 rounded-2xl py-3.5 px-4 outline-none" inputmode="numeric" maxlength="12" placeholder="Current PIN" required><input id="next" class="w-full bg-white/[.03] border border-white/10 rounded-2xl py-3.5 px-4 outline-none" inputmode="numeric" maxlength="12" placeholder="New PIN" required><input id="again" class="w-full bg-white/[.03] border border-white/10 rounded-2xl py-3.5 px-4 outline-none" inputmode="numeric" maxlength="12" placeholder="Confirm new PIN" required><button class="btn w-full rounded-2xl py-3.5 bg-cyan-300 text-black font-black">Save new PIN</button></form><p id="change-msg" class="min-h-5 text-center text-sm mt-4 text-white/45"></p><button id="back" class="w-full mt-2 py-3 text-white/45 font-bold text-sm">← Back to unlock</button></section><p class="text-center text-[11px] text-white/20 mt-6">PIN access is the admin console gate.</p></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';const URL='https://kklarbwjgyxqhculbluy.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrbGFyYndqZ3l4cWhjdWxibHV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTU0OTgsImV4cCI6MjA5NTkzMTQ5OH0.OBy2-itNIkb4l2zXrfM2cccxMVpIunSnRB8zUiYCWQ4',sb=createClient(URL,KEY),gate=document.querySelector('#gate'),change=document.querySelector('#change'),msg=document.querySelector('#msg'),pin=document.querySelector('#pin'),fn=async body=>{try{const r=await fetch(URL+'/functions/v1/admin-pin?ts='+Date.now(),{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'Cache-Control':'no-cache'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'PIN service returned HTTP '+r.status);return d}catch(e){if(e instanceof TypeError)throw new Error('Could not reach the admin PIN service. Please refresh the page and try again.');throw e}},digits=x=>/^\d{6,12}$/.test(x);document.querySelector('#pin-form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Checking PIN…';try{if(!digits(pin.value))throw new Error('PIN must be 6–12 digits.');const d=await fn({action:'verify',pin:pin.value});if(!d.ok)throw new Error('Incorrect PIN.');sessionStorage.setItem('pixelRiotPinProfile',d.profile.id);sessionStorage.setItem('pixelRiotPinRole',d.profile.role);sessionStorage.setItem('pixelRiotPinUsername',d.profile.username);location.href='./admin.html?v='+Date.now()}catch(err){msg.textContent=err.message||'Incorrect PIN.';gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');pin.select()}});document.querySelector('#change-open').onclick=async()=>{const s=(await sb.auth.getSession()).data.session;if(!s){msg.textContent='Sign in to your admin account first, then change your PIN.';return}gate.classList.add('hidden');change.classList.remove('hidden')};document.querySelector('#back').onclick=()=>{change.classList.add('hidden');gate.classList.remove('hidden');msg.textContent='';pin.focus()};document.querySelector('#change-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#change-msg'),old=document.querySelector('#old').value,next=document.querySelector('#next').value,again=document.querySelector('#again').value;try{if(!digits(old)||!digits(next)||next!==again)throw new Error('Use 6–12 digits and make the new PINs match.');const s=(await sb.auth.getSession()).data.session;if(!s)throw new Error('Please sign in first.');const r=await fetch(URL+'/functions/v1/admin-pin?ts='+Date.now(),{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+s.access_token,'Cache-Control':'no-cache'},body:JSON.stringify({action:'change',old_pin:old,new_pin:next})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Could not change PIN.');out.textContent='PIN changed successfully.';e.target.reset()}catch(err){out.textContent=err instanceof TypeError?'Could not reach the admin PIN service. Please refresh the page and try again.':(err.message||'Could not change PIN.')}});pin.focus();</script></body></html>
