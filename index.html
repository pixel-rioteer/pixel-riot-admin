<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL-RIOT // CONTROL</title>
<link rel="stylesheet" href="./admin-theme.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02030a;color:#fff}body{overflow:hidden}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr;position:relative}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(2,3,10,.7);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(24px);z-index:5}.brand{font:800 18px Orbitron,sans-serif;letter-spacing:.12em;color:#67e8f9;text-shadow:0 0 24px #22d3ee99}.status{font-size:12px;color:#94a3b8;letter-spacing:.12em;text-transform:uppercase}.frame{width:100%;height:calc(100vh - 72px);border:0;background:transparent}.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none}.orb.a{width:420px;height:420px;left:-170px;top:80px;background:#22d3ee22}.orb.b{width:480px;height:480px;right:-180px;bottom:-100px;background:#8b5cf622}
</style></head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="shell"><header class="top"><div class="brand">PIXEL-RIOT // CONTROL</div><div class="status" id="status">SECURE ADMIN CONSOLE</div></header><iframe class="frame" src="./admin.html" title="PIXEL-RIOT Admin"></iframe></div>
<script>
const frame=document.querySelector('.frame'),status=document.querySelector('#status');
frame.addEventListener('load',()=>{status.textContent='CONTROL LINK ESTABLISHED';try{const d=frame.contentDocument;if(d&&!d.getElementById('pr-admin-theme')){const l=d.createElement('link');l.id='pr-admin-theme';l.rel='stylesheet';l.href='./admin-theme.css';d.head.appendChild(l)}}catch(e){console.warn(e)}});
</script>
</body></html>
