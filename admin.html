<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>PIXEL-RIOT Admin</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}#console{width:100%;min-height:100vh;border:0}#error{display:none;padding:32px;color:#fff;font-family:system-ui,sans-serif}#error b{color:#22d3ee}</style>
</head>
<body>
<div id="error"><b>PIXEL-RIOT Admin</b><p>Unable to open the admin console.</p><button onclick="location.reload()">Retry</button></div>
<script>
(async()=>{
  if(!sessionStorage.getItem('pixelRiotPinProfile')){location.replace('./pin.html?v='+Date.now());return}
  const url='https://raw.githubusercontent.com/pixel-rioteer/pixel-riot-admin/ff670d14f971735949eb367c4cd24cb492cf116d/admin.html?v='+Date.now();
  try{
    const r=await fetch(url,{cache:'no-store',credentials:'omit'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('<p class="muted">Checking access…</p>','');
    document.open();document.write(html);document.close();
  }catch(e){console.error(e);document.getElementById('error').style.display='block'}
})();
</script>
</body>
</html>
