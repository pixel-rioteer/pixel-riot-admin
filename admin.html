cle at 50% 30%,#083344 0,#02030a 38%,#000 100%)}.pin-gate:before,.pin-gate:after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.35}.pin-gate:before{width:420px;height:420px;background:#06b6d4;top:-180px;left:-120px}.pin-gate:after{width:500px;height:500px;background:#7c3aed;right:-180px;bottom:-220px}.pin-card{position:relative;width:min(430px,calc(100vw - 32px));padding:38px;border:1px solid #22d3ee44;border-radius:30px;background:#020617d9;backdrop-filter:blur(24px);box-shadow:0 0 90px #22d3ee18,0 30px 100px #000}.pin-kicker{font-size:11px;letter-spacing:.24em;color:#67e8f9;font-weight:900}.pin-title{font-size:34px;font-weight:950;margin-top:8px}.pin-input{width:100%;margin-top:24px;padding:18px;text-align:center;font-size:28px;letter-spacing:.35em;border-radius:16px;background:#0009;border:1px solid #ffffff18;color:#fff}.pin-input:focus{outline:0;border-color:#22d3ee;box-shadow:0 0 30px #22d3ee22}.pin-error{min-height:22px;margin-top:12px;text-align:center;color:#fb7185;font-size:13px}.pin-gate.shake .pin-card{animation:shake .35s ease}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}.pin-submit{width:100%;margin-top:8px;padding:14px;border:0;border-radius:15px;background:#22d3ee;color:#001014;font-weight:950;cursor:pointer}.pin-submit:disabled{opacity:.55;cursor:wait}</style></head><body><div id="pinGate" class="pin-gate"><div class="pin-card"><div class="pin-kicker">PIXEL-RIOT // SECURE CONSOLE</div><div class="pin-title">Enter admin PIN</div><p style="color:#94a3b8;margin-top:8px">Enter your administrator PIN to continue.</p><form id="pinForm"><input id="pinInput" class="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="12" minlength="6" pattern="[0-9]{6,12}" placeholder="••••••" aria-label="Admin PIN" required><div id="pinError" class="pin-error"></div><button id="pinSubmit" class="pin-submit" type="submit">Unlock console</button></form></div></div><na
