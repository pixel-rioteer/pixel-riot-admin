<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PIXEL-RIOT Admin</title><style>html,body{margin:0;min-height:100%;background:#020207;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{display:grid;place-items:center}.load{text-align:center;color:#94a3b8}.spin{width:34px;height:34px;margin:0 auto;border:3px solid #ffffff18;border-top-color:#22d3ee;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><div id="status"></div></div><script>const OLD='https://raw.githubusercontent.com/pixel-rioteer/pixel-riot-admin/ff670d14f971735949eb367c4cd24cb492cf116d/admin.html';const qs='?v='+Date.now();(async()=>{try{if(!sessionStorage.getItem('pixelRiotPinProfile')){location.replace('./pin.html?v='+Date.now());return}const r=await fetch(OLD+qs,{cache:'no-store',credentials:'omit'});if(!r.ok)throw new Error('Could not load the admin console ('+r.status+').');let html=await r.text();html=html.replace('<p class="muted">Checking access…</p>','');document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').innerHTML=(e.message||'Could not load the admin console.')+'<br><br><button onclick="location.reload()" style="padding:10px 16px;border-radius:10px;border:1px solid #ffffff22;background:#22d3ee;color:#000;font-weight:800">Retry</button>'}})();</script></body></html>
