<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL-RIOT Admin</title><style>html,body{margin:0;min-height:100%;background:#020207;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{display:grid;place-items:center}.load{text-align:center;color:#94a3b8}.spin{width:34px;height:34px;margin:0 auto 16px;border:3px solid #ffffff18;border-top-color:#22d3ee;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><div id="status">Opening secure console…</div></div><script>const OLD='https://raw.githubusercontent.com/pixel-rioteer/pixel-riot-admin/ff670d14f971735949eb367c4cd24cb492cf116d/admin.html';(async()=>{try{if(!sessionStorage.getItem('pixelRiotPinProfile')){location.replace('./pin.html');return}const r=await fetch(OLD,{cache:'no-store'});if(!r.ok)throw new Error('Could not load the admin console.');const html=await r.text();document.open();document.write(html);document.close()}catch(e){document.querySelector('#status').textContent=e.message||'Could not load the admin console.'}})();</script></body></html>
