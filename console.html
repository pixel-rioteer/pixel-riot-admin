function preview(x){const p=x.props||{},st=boxStyle(x);switch(x.type){case'heading':return`<h3 style="${st}" class="text-2xl font-black">${esc(p.text||'Heading')}</h3>`;case'text':return`<p style="${st}" class=whitespace-pre-line>${esc(p.text||'Text')}</p>`;case'callout':case'notice':return`<div style="${st}"><b>${esc(p.title||'Notice')}</b><p>${esc(p.text||'')}</p></div>`;case'list':return`<ul style="${st}" class="list-disc pl-6">${String(p.items||'Item 1\nItem 2').split('\n').filter(Boolean).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;case'divider':return`<hr style="${st}border-color:currentColor;margin:16px 0">`;case'image':return p.url?`<div style="${st}"><img data-preview-image src="${esc(p.url)}" alt="${esc(p.alt||'')}" style="width:${clamp(p.width,10,100,100)}%;max-height:${clamp(p.maxHeight,100,1600,1600)}px;object-fit:${['contain','cover','fill'].includes(p.fit)?p.fit:'contain'};display:block;margin:${p.align==='left'?'0 auto 0 0':p.align==='right'?'0 0 0 auto':'0 auto'}" class=max-w-full></div>`:`<div class=muted>Add an image URL</div>`;case'link':return`<a style="${st}color:${x.style?.textColor||'#22d3ee'}" class=underline>${esc(p.text||'Open page')}</a>`;case'button':return`<span style="${st}background:${x.style?.background||'#22d3ee'};color:${x.style?.textColor||'#000'}" class="inline-block px-4 py-2 font-black">${esc(p.text||'Button')}</span>`;case'video':return`<div style="${st}" class="p-6 text-center">▶ ${esc(p.title||'Video')}</div>`;case'quote':return`<blockquote style="${st}border-left:4px solid ${x.style?.borderColor||'#22d3ee'}" class=pl-4>“${esc(p.text||'Quote')}” — ${esc(p.author||'')}</blockquote>`;case'code':return`<pre style="${st}" class="p-4 overflow-auto"><code>${esc(p.text||'Code')}</code></pre>`;case'spacer':return`<div style="height:${clamp(p.height,8,240,32)}px"></div>`;case'accordion':return`<details style="${st}"><summary class=font-bold>${esc(p.title||'More information')}</summary><p>${esc(p.text||'')}</p></details>`;default:ret <label>Accent<input data-theme=accent type=color value=${t.accent} class="w-full h-9"></label><label>Text<input data-theme=text type=color value=${t.text} class="w-full h-9"></label>

<label>Background<input data-theme=background type=color value=${valid(t.background)?t.background:'#000000'} class="w-full h-9"></label>
<label>Mode<select data-theme=backgroundStyle class=field><option value=none ${t.backgroundStyle==='none'?'selected':''}>None</option><option value=solid ${t.backgroundStyle==='solid'?'selected':''}>Solid</option><option value=gradient ${t.backgroundStyle==='gradient'?'selected':''}>Gradient / glow</option></select></label>
