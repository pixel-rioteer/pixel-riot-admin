const gc=document.querySelector('#games');if(gc)gc.innerHTML=gs.map(g=>`<article class=game-row data-gid=${g.id}><div class="flex flex-col md:flex-row justify-between gap-3"><div><h3 class="text-xl font-black">${esc(g.title)}</h3><p class=muted>${esc(g.slug)} · ${esc(g.category||'')}</p></div><div class="flex gap-3"><button data-build class=action-cyan>Page Builder</button>${canA('manage_games_edit')?'<button data-edit class=action-purple>Edit</button>':''}${canA('manage_games_delete')?'<button data-delete class=action-red>Delete</button>':''}</div></div><div data-builder-slot></div><div data-edit-slot></div></article>`).join('');gc?.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>builder(gs.find(x=>String(x.id)===b.closest('[data-gid]').dataset.gid),b.closest('[data-gid]')));gc?.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this game?')){const r=await sb.from('games').delete().eq('id',b.closest('[data-gid]').dataset.gid);if(r.error)alert(r.error.message);else b.closest('[data-gid]').remove()}});gc?.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=gs.find(x=>String(x.id)===b.closest('[data-gid]').dataset.gid),s=b.closest('[data-gid]').querySelector('[data-edit-slot');s.innerHTML=`<form class="grid md:grid-cols-2 gap-2 mt-4"><input name=title class=field value="${esc(g.title)}"><input name=category class=field value="${esc(g.category||'')}"><input name=platform class=field value="${esc(g.platform||'')}"><input name=price class=field value="${esc(g.price||'')}"><input name=tagline class="field md:col-span-2" value="${esc(g.tagline||'')}"><input name=image_url class="field md:col-span-2" value="${esc(g.image_url||'')}"><textarea name=description class="field md:col-span-2">${esc(g.description||'')}</textarea><button class="md:col-span-2 primary">Save content</button></form>`;s.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await sb.from('games').update({title:f.title.value,category:f.category.value,platform:f.platform.value,price:f.price.value,tagline:f.tagline.value,image_url:f.image_url.value,description:f.description.value}).eq('id',g.id);if(r.error)alert(r.error.message);else location.reload()}})}
const rr=document.querySelector('#requests');if(rr){(async()=>{const r=await sb.from('game-reqs').select('*').order('id',{ascending:false});rr.innerHTML=(r.data||[]).map(x=>`<article class=request><div><b>${esc(x.gamename)}</b><p class=muted>${esc(x.username||'')} · ${esc(x.email||'')}</p></div><button data-rid=${x.id} class=action-red>Dismiss & delete</button></article>`).join('')||'<p class=muted>No pending requests.</p>';rr.querySelectorAll('[data-rid]').forEach(b=>b.onclick=async()=>{if(confirm('Permanently delete this request?')){await sb.from('game-reqs').delete().eq('id',b.dataset.rid);b.closest('.request').remove()}})})()}
const rc=document.querySelector('#reports');if(rc){(async()=>{const r=await sb.from('reports').select('id,reason,status,created_at,reported_user_id,reported:reported_user_id(username,role,tag)').order('created_at',{ascending:false});const rows=(r.data||[]).filter(x=>x.status==='pending');rc.innerHTML=rows.map(x=>`<article class=request><div><b>${esc(x.reported?.username||'Unknown')}</b><p class=muted>${esc(x.reason)}</p></div><div class=flex gap-3><button data-status=resolved data-rid=${x.id} class=action-cyan>Resolve</button><button data-status=dismissed data-rid=${x.id} class=action-red>Dismiss</button></div></article>`).join('')||'<p class=muted>No pending reports.</p>';rc.querySelectorAll('[data-rid]').forEach(b=>b.onclick=async()=>{await sb.from('reports').update({status:b.dataset.status}).eq('id',b.dataset.rid);b.closest('.request').remove()})})()}
